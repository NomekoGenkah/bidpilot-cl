<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BidPilot CL</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand">BidPilot <span>CL</span></a
      ><span class="local">Local</span
      ><button
        class="help"
        type="button"
        aria-label="Ayuda sobre los datos locales"
        data-help="Los documentos se guardan en este computador. Al analizar, se envían a Meta los requisitos, fragmentos seleccionados de evidencia y tus respuestas. No se envían postulaciones al portal."
      >
        ?
      </button>
    </header>
    <main>
      <h1 class="sr-only">Revisión de licitación</h1>
      <section class="tenderbar" aria-label="Licitación actual">
        <div class="tenderpick">
          <label for="tender">Licitación</label
          ><select id="tender">
            <option value="">Cargando…</option>
          </select>
        </div>
        <span id="profile" class="demo-label" hidden>Perfil ficticio</span>
        <div class="main-actions">
          <button id="generate" class="primary">Analizar con Meta</button
          ><button
            class="help"
            type="button"
            aria-label="Qué ocurre al analizar"
            data-help="Meta contrasta los requisitos con tus documentos y respuestas. Puede tardar varios minutos. Mientras trabaja no puedes cambiar la evidencia. Los resultados son provisionales y requieren revisión humana."
          >
            ?
          </button>
          <details class="export-menu">
            <summary>Exportar</summary>
            <div>
              <a id="exportjson" hidden>JSON</a><a id="exportmd" hidden>Markdown</a
              ><span id="exportempty">Primero genera un análisis actualizado.</span>
            </div>
          </details>
        </div>
      </section>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="progress" role="status" aria-live="polite"></div>
      <nav class="sections" aria-label="Secciones">
        <button id="tab-matrix" aria-current="page">Matriz <span id="count-matrix"></span></button
        ><button id="tab-questions">Preguntas <span id="count-questions"></span></button
        ><button id="tab-documents">Documentos <span id="count-documents"></span></button
        ><span id="updated"></span>
      </nav>
      <section id="review-view" aria-label="Revisión de requisitos">
        <div id="summary" class="summary"></div>
        <div class="filters">
          <div class="searchfield">
            <label for="requirement-search" class="sr-only">Buscar requisitos o preguntas</label
            ><input type="search" id="requirement-search" placeholder="Buscar requisito…" />
          </div>
          <label for="filter" class="sr-only">Filtrar por estado</label
          ><select id="filter">
            <option value="attention">Por resolver</option>
            <option value="all">Todos los estados</option>
            <option value="falta">Falta evidencia</option>
            <option value="dudoso">Por aclarar</option>
            <option value="pending">Revisar bases</option>
            <option value="contradiction">Contradicción</option>
            <option value="cumple">Cumple</option>
            <option value="not-applicable">No aplica</option></select
          ><label for="stage" class="sr-only">Filtrar por etapa</label
          ><select id="stage">
            <option value="all">Todas las etapas</option>
            <option value="oferta">Oferta</option>
            <option value="adjudicacion">Adjudicación</option>
            <option value="ejecucion">Ejecución</option></select
          ><button
            class="help"
            type="button"
            aria-label="Ayuda sobre los estados"
            data-help="Falta evidencia significa que no se encontró respaldo suficiente, no un incumplimiento definitivo. Revisar bases significa que las citas del requisito necesitan revisión. No aplica es una condición que no se cumple para este proveedor; no cuenta como cumplimiento."
          >
            ?
          </button>
        </div>
        <div id="workbench" class="workbench">
          <div class="list-pane">
            <div id="matrix"></div>
            <div class="pagination">
              <span id="range" aria-live="polite"></span
              ><button id="previous" class="quiet">Anterior</button
              ><button id="next" class="quiet">Siguiente</button>
            </div>
          </div>
          <aside id="detail" class="detail" aria-labelledby="detail-title" hidden></aside>
        </div>
      </section>
      <section id="documents-view" aria-label="Documentos del proveedor" hidden>
        <div class="documents-actions">
          <details id="uploadbox">
            <summary class="primary">Añadir documento</summary>
            <form id="upload">
              <label for="docname">Nombre</label
              ><input
                id="docname"
                maxlength="180"
                placeholder="Ej. Certificado de experiencia"
              /><label for="file">Archivo PDF o texto</label
              ><input id="file" type="file" accept=".pdf,.txt,.md" />
              <div class="label-help">
                <label for="doctext">O pegar texto</label
                ><button
                  class="help"
                  type="button"
                  aria-label="Ayuda para cargar documentos"
                  data-help="Elige un archivo o pega texto, una opción a la vez. Máximo 8 MB y 200.000 caracteres extraídos. Los PDF escaneados necesitan OCR externo. Se conserva el texto por página; guarda el archivo original por tu cuenta."
                >
                  ?
                </button>
              </div>
              <textarea id="doctext" rows="5"></textarea
              ><label class="check"
                ><input id="fictional" type="checkbox" /> Documento ficticio</label
              ><button type="submit" class="primary">Guardar documento</button>
            </form>
          </details>
          <button id="demo" class="quiet">Cargar perfil ficticio</button
          ><button
            class="help"
            type="button"
            aria-label="Ayuda sobre el perfil ficticio"
            data-help="Añade tres documentos de Taller Sur SpA para probar el flujo: una oferta de ejemplo y dos versiones contradictorias de experiencia. No representan una empresa real. Cualquier análisis que los use queda marcado como demostración."
          >
            ?</button
          ><label for="search" class="sr-only">Buscar en documentos</label
          ><input id="search" type="search" placeholder="Buscar en documentos…" />
        </div>
        <div id="results" aria-live="polite"></div>
        <div class="documents-layout">
          <div id="documents"></div>
          <aside
            id="document-viewer"
            class="document-viewer"
            aria-label="Contenido del documento"
            hidden
          ></aside>
        </div>
      </section>
    </main>
    <footer>
      <span>Revisión humana requerida. No es asesoría legal.</span
      ><button
        class="help"
        type="button"
        aria-label="Ayuda para interpretar el análisis"
        data-help="Las citas pueden existir literalmente y aun así no respaldar toda una interpretación. Comprueba las bases originales y sus aclaraciones antes de usar los resultados. La aplicación no presenta ofertas en el portal."
      >
        ?
      </button>
    </footer>
    <div id="tooltip" role="tooltip" hidden></div>
  </body>
</html>

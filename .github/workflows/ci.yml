name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Instalar agent-browser (lo usa el ensayo de la demo)
        run: npm install -g agent-browser@0.39.0 && agent-browser install --with-deps
      - run: npm run demo:rehearse
